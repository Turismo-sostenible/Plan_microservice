services:
  # Servicio Web Principal
  - type: web
    name: microservice-plans
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render usa puerto 10000 por defecto
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false  # Configura en dashboard
      - key: RABBITMQ_URL
        sync: false  # Configura en dashboard
      - key: UPLOAD_PATH
        value: /tmp/uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        sync: false  # Configura en dashboard con tu dominio