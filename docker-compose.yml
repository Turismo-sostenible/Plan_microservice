version: '3.9'

services:
  plan-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plan-microservice
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI:-mongodb://host.docker.internal:27017/plans_service}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://host.docker.internal}
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - STORAGE_PATH=./uploads
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - turismo-network
    depends_on:
      - plan-service
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  turismo-network:
    driver: bridge
